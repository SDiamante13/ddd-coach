<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board interactions 4b to 4d</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../../../src/styles/tokens.css">
<style>
/* Exploration 09 for #95-#97 on layout B: correct + undo, keep the visitor's positions, connect, hotspot. */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:400 var(--text-base)/var(--leading-body) var(--font-body);color:var(--color-ink);background:var(--color-paper);overflow:hidden}
.board-bg{background-color:var(--color-paper);background-image:radial-gradient(var(--color-paper-dot) 1px,transparent 1.2px);background-size:22px 22px}
.label{font:500 10px/1 var(--font-label);text-transform:uppercase;letter-spacing:.05em}
.muted{color:var(--color-ink-muted)}
.cap{position:fixed;left:0;right:0;top:0;z-index:50;padding:8px 16px;background:#1d4ed8;color:#fff;font:600 15px/1.3 var(--font-body)}
.cap b{opacity:.8;margin-right:8px}
.stage{position:absolute;inset:36px 360px 0 0;overflow:hidden}
.stage h1{position:absolute;left:32px;top:14px;margin:0;font:700 24px/1 var(--font-display);letter-spacing:var(--tracking-display)}
.lanehead{position:absolute;left:32px;top:56px;display:flex;gap:12px;align-items:baseline}
svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.card{position:absolute;width:136px;min-height:102px;padding:8px 10px 10px;border-radius:var(--radius-card);background:var(--color-card-event);color:var(--color-card-ink);box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:5px}
.card .top{display:flex;justify-content:space-between;color:rgb(28 27 24 / .72);white-space:nowrap}
.card .t{font:600 14.5px/1.18 var(--font-display)}
.card .was{font:400 11.5px/1.25 var(--font-body);text-decoration:line-through;color:rgb(28 27 24 / .6)}
.card.guess{background:#f9d4ae;border:2px dashed #a0581a;box-shadow:none}
.card.q{background:var(--color-card-question);width:176px}
.card.new::after,.card.drawn::after{content:"";position:absolute;inset:-7px;border:2px dashed var(--color-coach);border-radius:4px}
.card .tag{position:absolute;top:-22px;left:-7px;padding:3px 6px;border-radius:3px;background:var(--color-coach);color:var(--color-on-coach)}
.card.sel{outline:3px solid var(--color-ink);outline-offset:3px}
.card.editing{outline:2px solid var(--color-coach);outline-offset:2px}
.card .edit{background:#fffaf2;border:1px solid var(--color-coach);border-radius:3px;padding:3px 5px;font:600 14px/1.2 var(--font-display)}
.caret{display:inline-block;width:2px;height:14px;background:var(--color-coach);vertical-align:-2px;margin-left:1px}
.hint{position:absolute;padding:4px 8px;border-radius:6px;background:var(--color-surface);border:1px solid var(--color-line-strong);font-size:12px;color:var(--color-ink-muted);white-space:nowrap}
.pill{position:absolute;display:inline-flex;gap:8px;align-items:center;padding:5px 6px 5px 12px;border-radius:var(--radius-pill);background:var(--color-ink);color:var(--color-paper);font-size:12.5px;white-space:nowrap}
.pill b{padding:3px 10px;border-radius:var(--radius-pill);background:var(--color-paper);color:var(--color-ink);font-weight:600}
.ghost{position:absolute;width:136px;height:102px;border:2px dashed var(--color-line-strong);border-radius:3px;opacity:.55}
.handle{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--color-coach);border:2px solid var(--color-surface)}
.cursor{position:absolute;width:0;height:0;border-left:9px solid var(--color-ink);border-top:6px solid transparent;border-bottom:6px solid transparent;transform:rotate(-35deg)}
.coachptr{position:absolute;padding:2px 7px;border-radius:4px;background:var(--color-coach);color:var(--color-on-coach);font:600 11px/1.4 var(--font-body)}
.suggest{position:absolute;display:flex;gap:6px;align-items:center;font-size:12px;padding:4px 6px 4px 10px;border-radius:var(--radius-pill);background:var(--color-surface);border:1px dashed var(--color-coach);color:var(--color-ink)}
.suggest span{padding:2px 8px;border-radius:var(--radius-pill);border:1px solid var(--color-line-strong)}
.suggest span.ok{background:var(--color-coach);color:var(--color-on-coach);border-color:var(--color-coach)}

.dock{position:absolute;top:36px;right:0;bottom:0;width:360px;background:var(--color-surface-sunken);border-left:1px solid var(--color-line);display:flex;flex-direction:column}
.dockhead{padding:12px 16px 10px;border-bottom:1px solid var(--color-line)}
.qcard{border:1px solid var(--color-coach);border-radius:var(--radius-md);background:var(--color-surface);padding:11px 13px}
.qcard .role{color:var(--color-coach);margin-bottom:6px;line-height:1.4;font-size:11px}
.qcard .qt{font-weight:600;line-height:1.35;font-size:15px}
.qcard blockquote{margin:7px 0 0;padding-left:9px;border-left:2px solid var(--color-line-strong);color:var(--color-ink-muted);font-size:13px}
.onboard{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:var(--radius-pill);border:1px solid var(--color-card-question);color:var(--color-card-question);font-size:12.5px;font-weight:500}
.log{flex:1;overflow:hidden;padding:12px 16px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.coach{border-radius:var(--radius-md);padding:9px 12px;background:var(--color-coach-tint)}
.who2{color:var(--color-coach);margin-bottom:5px}
.you{border-radius:var(--radius-md);padding:9px 12px;background:var(--color-surface);border:1px solid var(--color-line);align-self:flex-end;max-width:92%}
.act{border-left:2px solid var(--color-line-strong);padding:2px 0 2px 10px;color:var(--color-ink-muted);font-size:12.5px}
.foot{padding:12px 16px 14px}
.composer{border:1px solid var(--color-line);border-radius:var(--radius-md);background:var(--color-surface);padding:9px}
.composer .box{border:1px solid var(--color-coach);border-radius:var(--radius-sm);padding:7px 9px;color:var(--color-ink-muted);font-size:13px}
</style>
</head>
<body>
<div class="cap" id="cap"></div>
<div class="stage board-bg" id="stage"></div>
<div class="dock" id="dock"></div>
<script>
const W = 136, H = 102, Y = 150;
const x = i => 32 + i * 172;
const BASE = [
  { id: "e1", src: "FROM THREAD", t: "Customer booked a delivery appointment", x: x(0), y: Y },
  { id: "e2", src: "FROM THREAD", t: "Truck picked up after the pickup window", x: x(1), y: Y },
  { id: "e3", src: "FROM THREAD", t: "Load 7731 delivered past the appointment", x: x(2), y: Y },
  { id: "e4", src: "FROM THREAD", t: "Weekly late report listed 7731", x: x(3), y: Y },
  { id: "e5", src: "GUESS", t: "Service credit issued to Customer D?", x: x(4), y: Y, guess: true },
];
const THEN = [["e1", "e2"], ["e2", "e3"], ["e3", "e4"], ["e4", "e5"]];

const STATES = {
  1: { cap: "4a today · events land in one lane, joined by Then arrows" },
  2: { cap: "4b · Double-click a sticky to correct it in place. Enter keeps, Esc cancels" },
  3: { cap: "4b · Your wording wins: YOU SAID, the old words struck until the next turn, Undo close by" },
  4: { cap: "4b · Drag a sticky anywhere. The coach's next turn adds a card, and your position is kept by ID" },
  5: { cap: "4c · Drag from a handle to connect. The coach can suggest a link too, as a dashed idea you accept or dismiss" },
  6: { cap: "4d · The coach's question becomes a hotspot on the board, linked to the two events it joins" },
};

function cardsFor(s) {
  const cards = BASE.map(c => ({ ...c }));
  const e2 = cards[1], e5 = cards[4];
  if (s === 2) e2.editing = true;
  if (s >= 3) { e2.src = "YOU SAID"; e2.was = e2.t; e2.t = "Truck picked up 50 min after the window"; }
  if (s >= 4) { e2.was = null; e5.x = x(3) + 40; e5.y = 390; }
  if (s >= 4) cards.push({ id: "e6", src: "FROM THREAD", t: "Credit reversed after the review", x: x(4), y: Y, fresh: s === 4 });
  if (s === 3) e2.sel = true;
  if (s === 6) cards.push({ id: "q1", q: true, src: "OPEN", t: "Which definition decides whether 7731 counts as late?", x: 150, y: 360, fresh: true });
  return cards;
}

function wiresFor(s) {
  const w = THEN.map(([a, b]) => ({ a, b, kind: "then" }));
  if (s >= 4) w.push({ a: "e4", b: "e6", kind: "then", fresh: s === 4 });
  if (s >= 5) w.push({ a: "e3", b: "e5", kind: s === 5 ? "drawn" : "then" });
  if (s === 5) w.push({ a: "e5", b: "e6", kind: "idea" });
  if (s === 6) { w.push({ a: "q1", b: "e1", kind: "relates" }); w.push({ a: "q1", b: "e2", kind: "relates" }); }
  return w;
}

function cardHtml(c) {
  const cls = ["card", c.guess ? "guess" : "", c.q ? "q" : "", c.fresh ? "new" : "", c.sel ? "sel" : "", c.editing ? "editing" : ""].join(" ");
  const tag = c.fresh ? `<span class="tag label">Just added</span>` : "";
  const kind = c.q ? "Question" : "Event";
  const body = c.editing
    ? `<div class="edit">Truck picked up 50 min after the window<span class="caret"></span></div>`
    : `<div class="t">${c.t}</div>${c.was ? `<div class="was">${c.was}</div>` : ""}`;
  return `<div class="${cls}" style="left:${c.x}px;top:${c.y}px">${tag}<div class="top label"><span>${kind}</span><span>${c.src}</span></div>${body}</div>`;
}

function anchor(c, side) {
  const w = c.q ? 176 : W;
  if (side === "r") return [c.x + w, c.y + H / 2];
  if (side === "l") return [c.x, c.y + H / 2];
  if (side === "t") return [c.x + w / 2, c.y];
  return [c.x + w / 2, c.y + H];
}

function path(a, b) {
  if (Math.abs(a.y - b.y) < 10) { const [x1, y1] = anchor(a, "r"), [x2, y2] = anchor(b, "l"); return `M${x1},${y1} L${x2 - 4},${y2}`; }
  const [x1, y1] = anchor(a, a.y < b.y ? "b" : "t"), [x2, y2] = anchor(b, a.y < b.y ? "t" : "b");
  const my = (y1 + y2) / 2;
  return `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2 - (a.y < b.y ? 4 : -4)}`;
}

function wiresSvg(s, byId) {
  const style = {
    then: `stroke="var(--color-ink)" stroke-width="2" marker-end="url(#ah)"`,
    drawn: `stroke="var(--color-coach)" stroke-width="4" marker-end="url(#ahs)"`,
    idea: `stroke="var(--color-coach)" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ahb)"`,
    relates: `stroke="var(--color-card-question)" stroke-width="2" stroke-dasharray="2 5"`,
  };
  const paths = wiresFor(s).map(w => `<path d="${path(byId[w.a], byId[w.b])}" fill="none" ${style[w.kind]}/>`).join("");
  return `<svg class="wires"><defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink)"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-coach)"/></marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-coach)"/></marker>
  </defs>${paths}</svg>`;
}

function overlays(s) {
  if (s === 2) return `<div class="hint" style="left:${x(1) - 8}px;top:${Y + H + 14}px">Enter keeps · Esc cancels</div>`;
  if (s === 3) return `<div class="pill" style="left:${x(1) - 20}px;top:${Y + H + 18}px">Corrected your sticky <b>Undo</b></div>`;
  if (s === 4) return `<div class="ghost" style="left:${x(4)}px;top:${Y}px;opacity:0"></div><div class="cursor" style="left:${x(3) + 170}px;top:${420}px"></div><div class="hint" style="left:${x(3) - 330}px;top:430px">Moved by you · kept when the coach adds cards</div>`;
  if (s === 5) return `<div class="handle" style="left:${x(2) + W / 2 - 7}px;top:${Y + H - 7}px"></div><div class="suggest" style="left:${x(3) - 70}px;top:540px;white-space:nowrap">Coach's idea: reversal follows the credit? <span class="ok">Keep</span><span>Dismiss</span></div>`;
  if (s === 6) return `<div class="coachptr" style="left:${150 + 150}px;top:${360 + H - 6}px">Coach</div>`;
  return "";
}

function renderStage(s) {
  const cards = cardsFor(s);
  const byId = Object.fromEntries(cards.map(c => [c.id, c]));
  document.getElementById("stage").innerHTML = `<h1>DDD Coach</h1><div class="lanehead"><span class="label muted">Timeline · Events</span><span class="muted" style="font-size:13px">${cards.filter(c => !c.q).length} events${s >= 6 ? " · 1 open question" : ""}</span></div>${wiresSvg(s, byId)}${cards.map(cardHtml).join("")}${overlays(s)}`;
}

function renderDock(s) {
  const q = `<div class="qcard"><div class="role label">Question for the account team lead and the billing lead, at Friday's service review</div><div class="qt">Which definition decides whether load 7731 counts as late: the delivery appointment, the pickup window, or both?</div><blockquote>“in the contract a load is late when we miss the delivery appointment”</blockquote><blockquote>“7731 picked up 50 min after the window”</blockquote>${s === 6 ? `<span class="onboard">On the board ↖ linked to 2 events</span>` : ""}</div>`;
  const acts = {
    1: "",
    2: `<div class="act">Editing “Truck picked up after the pickup window”…</div>`,
    3: `<div class="act">You corrected a sticky: “after the pickup window” → “50 min after the window”. The coach's next turn uses your wording.</div>`,
    4: `<div class="you"><div class="who2 label muted">You</div>What happened after the review?</div><div class="coach"><div class="who2 label">Coach</div>Added one event: the credit was reversed. Your sticky and the one you moved stayed where you put them.</div>`,
    5: `<div class="act">You connected “delivered past the appointment” → “Service credit issued?”.</div><div class="coach"><div class="who2 label">Coach</div>I've suggested one more link on the board. Keep it or dismiss it.</div>`,
    6: `<div class="coach"><div class="who2 label">Coach</div>I put the question on the board, next to the two events it joins.</div>`,
  };
  document.getElementById("dock").innerHTML = `<div class="dockhead">${q}</div><div class="log">${acts[s]}</div><div class="foot"><div class="composer"><div class="box">Paste a thread or ask a follow-up</div></div></div>`;
}

function show(s) {
  document.getElementById("cap").innerHTML = `<b>Exploration 09 · Board slices 4b–4d</b>${STATES[s].cap}`;
  renderStage(s);
  renderDock(s);
}
window.runTo = show;
show(Number(new URLSearchParams(location.search).get("state") || 1));
</script>
</body>
</html>
